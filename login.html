<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#350816">
<title>Login - WCMatrimony</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="auth-page">

    <div class="auth-visual" aria-hidden="true">

        <a href="index.html" class="logo">WC <span>Matrimony</span></a>

        <div class="auth-visual-frame">
            <blockquote>
                <p>"It felt less like an app and more like a respectful introduction."</p>
                <cite>Imran &amp; Zoya, joined 2025</cite>
            </blockquote>
        </div>

        <p class="auth-visual-foot">Verified profiles. Thoughtful matching. Family, involved from day one.</p>

    </div>

    <div class="auth-form-side">

        <div class="auth-card">

            <a href="index.html" class="logo">WC <span>Matrimony</span></a>

            <h1>Welcome Back</h1>
            <p class="auth-sub">Log in to continue your search.</p>

            <form id="loginForm" class="auth-form">

                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" type="email" placeholder="Email" required>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" type="password" placeholder="Password" required>
                </div>

                <button type="submit" class="btn btn-gold btn-block">Login</button>

            </form>

            <p class="auth-switch">
                New here? <a href="register.html">Create a free account</a>
            </p>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/login.js"></script>
</body>
</html>
